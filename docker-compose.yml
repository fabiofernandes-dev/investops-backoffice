name: investops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investops}
      POSTGRES_DB: ${POSTGRES_DB:-investops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investops} -d ${POSTGRES_DB:-investops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-investops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-investops}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./worker-go
    restart: on-failure
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-investops}:${POSTGRES_PASSWORD:-investops}@postgres:5432/${POSTGRES_DB:-investops}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-investops}:${RABBITMQ_PASSWORD:-investops}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  marketdata:
    build: ./marketdata-go
    restart: on-failure
    environment:
      GRPC_PORT: "5300"
    ports:
      - "${MARKETDATA_PORT:-5300}:5300"

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrator
    command: ["--seed"]
    environment:
      INVESTOPS_DB: Host=postgres;Port=5432;Database=${POSTGRES_DB:-investops};Username=${POSTGRES_USER:-investops};Password=${POSTGRES_PASSWORD:-investops}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-investops};Username=${POSTGRES_USER:-investops};Password=${POSTGRES_PASSWORD:-investops}
      RabbitMq__Host: rabbitmq
      MarketData__Url: http://marketdata:5300
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      marketdata:
        condition: service_started
      migrator:
        condition: service_completed_successfully

  web:
    build: ./frontend/investops-web
    restart: on-failure
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata:
