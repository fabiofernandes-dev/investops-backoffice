name: CI

on:
  pull_request:
    branches: [developer, main]
  push:
    branches: [developer, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore backend/InvestOps.sln

      - name: Build
        run: dotnet build backend/InvestOps.sln --no-restore -c Release

      - name: Test
        run: dotnet test backend/InvestOps.sln --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        continue-on-error: true   # não falhar o job por cota de artifacts esgotada
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  worker:
    name: Worker (Go) build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: worker-go/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...   # integração via testcontainers (Docker disponível no runner)

  marketdata:
    name: Market Data (Go gRPC) build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketdata-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: marketdata-go/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...   # gRPC via bufconn (em memória)

  web:
    name: Frontend (Angular) build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/investops-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/investops-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
